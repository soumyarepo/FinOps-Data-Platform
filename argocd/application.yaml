apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finops-data-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soumyarepo/FinOps-Data-Platform.git
    targetRevision: develop
    path: helm/finbank-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: finbank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
