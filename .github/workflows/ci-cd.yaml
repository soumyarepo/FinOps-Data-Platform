name: Build and Push Banking Services

on:
  push:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'helm/**'
      - 'argocd/**'
      - '.github/workflows/ci-cd.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account-service
          - transaction-service
          - loan-service
          - fraud-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/finops-data-platform/${{ matrix.service }}:${{ github.sha }} app/${{ matrix.service }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/finops-data-platform/${{ matrix.service }}:${{ github.sha }}

      - name: Update Helm image tag
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/g" helm/finbank-app/values.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/banking-app/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
              --region ${{ secrets.AWS_REGION }} \
              --name finops-data-platform-dev-eks

      - name: Verify EKS connection
        run: |
          kubectl get nodes

      - name: Apply Argo CD Application
        run: |
          kubectl apply -f argocd/application.yaml
        
