name: Build and Push Banking Services

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/ci-cd.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account-service
          - transaction-service
          - loan-service
          - fraud-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/finops-data-platform/${{ matrix.service }}:${{ github.sha }} app/${{ matrix.service }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/finops-data-platform/${{ matrix.service }}:${{ github.sha }}
